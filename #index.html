<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoshino's Daily</title>
    <style>
        :root {
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --primary-pink: #ffb3c6;
            --dark-pink: #ff4d6d;
            --accent-pink: #ffe5ec;
            --text-color: #59405c;
            --gray-text: #8c7893;
            --shadow: 0 4px 15px rgba(255, 179, 198, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid var(--primary-pink);
        }

        header {
            background: var(--primary-pink);
            color: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 2px dashed #fff;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 0.85rem;
            margin-top: 4px;
            opacity: 0.9;
        }

        .wallet-nav {
            display: flex;
            gap: 6px;
            padding: 12px 16px 0 16px;
            overflow-x: auto;
        }

        .wallet-tab {
            background: var(--accent-pink);
            border: 1px solid var(--primary-pink);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            white-space: nowrap;
        }

        .wallet-tab.active {
            background: var(--dark-pink);
            color: white;
            border-color: var(--dark-pink);
        }

        .add-wallet-btn {
            background: #fff;
            border: 1px dashed var(--dark-pink);
            color: var(--dark-pink);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .wallet-controls {
            padding: 8px 16px 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .wallet-controls-group {
            display: flex;
            gap: 10px;
        }

        .wallet-controls button {
            background: none;
            border: none;
            color: var(--gray-text);
            cursor: pointer;
            font-size: 0.75rem;
            text-decoration: underline;
        }

        .backup-controls {
            padding: 4px 16px 0 16px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            font-size: 0.75rem;
        }

        .backup-controls button {
            background: none;
            border: none;
            color: var(--dark-pink);
            cursor: pointer;
            text-decoration: underline;
            font-weight: 600;
        }

        .wallet-banner {
            margin: 12px 16px 0 16px;
            height: 110px;
            background: var(--accent-pink);
            border-radius: 16px;
            border: 1px dashed var(--primary-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            overflow: visible;
        }

        .circle-frame {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--primary-pink);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .circle-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sakura-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid var(--primary-pink);
            z-index: 2;
        }

        #fileInput, #importInput {
            display: none;
        }

        .balance-card {
            background: var(--accent-pink);
            margin: 12px 16px 16px 16px;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
        }

        .balance-card h3 {
            font-size: 0.85rem;
            color: var(--gray-text);
            margin-bottom: 2px;
        }

        .balance-card .total-amount {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--dark-pink);
        }

        .denomination-summary {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--primary-pink);
            font-size: 0.8rem;
            color: var(--text-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .denom-badge {
            background: #fff;
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid var(--primary-pink);
            font-weight: 600;
        }

        form {
            padding: 0 16px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray-text);
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--primary-pink);
            border-radius: 10px;
            font-size: 0.95rem;
            background: #fff;
            color: var(--text-color);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--dark-pink);
        }

        .row-inputs {
            display: flex;
            gap: 10px;
        }

        .row-inputs .input-group {
            flex: 1;
        }

        .denom-container {
            background: var(--accent-pink);
            border: 1px dashed var(--primary-pink);
            padding: 10px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .denom-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .denom-item label {
            font-size: 0.7rem;
            text-align: center;
        }

        .denom-item input {
            padding: 6px;
            text-align: center;
            font-size: 0.85rem;
        }

        button.submit-btn {
            background: var(--dark-pink);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .history-section {
            padding: 0 16px 20px 16px;
            flex: 1;
        }

        .history-section h2 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .history-item {
            background: #fff;
            border: 1px solid var(--accent-pink);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-desc {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .history-date {
            font-size: 0.75rem;
            color: var(--gray-text);
        }

        .history-amount-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .history-amount {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .history-denoms {
            font-size: 0.7rem;
            color: var(--gray-text);
        }

        .amount-gain {
            color: #2a9d8f;
        }

        .amount-spend {
            color: #ff4d6d;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 1rem;
            cursor: pointer;
            padding-left: 8px;
        }

        .empty-state {
            text-align: center;
            color: var(--gray-text);
            font-size: 0.85rem;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header>
            <h1>🌸 Hoshino's Daily 🌸</h1>
            <p>Your clean & cozy wallet tracker~</p>
        </header>

        <div class="wallet-nav" id="walletNav"></div>

        <div class="wallet-controls">
            <button onclick="renameCurrentWallet()">✏️ Rename</button>
            <div class="wallet-controls-group">
                <button onclick="toggleDenomSystem()" id="toggleDenomBtn">⚙️ Denoms: OFF</button>
                <button onclick="deleteCurrentWallet()" style="color: #ff4d6d;">🗑️ Delete</button>
            </div>
        </div>

        <div class="backup-controls">
            <button onclick="exportData()">💾 Export Backup</button>
            <button onclick="document.getElementById('importInput').click()">📂 Import Backup</button>
        </div>

        <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">
        <input type="file" id="importInput" accept=".json" onchange="importData(event)">

        <div class="wallet-banner" id="walletBanner" onclick="handleBannerClick()"></div>

        <div class="balance-card">
            <h3 id="currentWalletTitle">Total Balance</h3>
            <div class="total-amount" id="totalBalance">0</div>
            <div class="denomination-summary" id="denomSummary" style="display: none;"></div>
        </div>

        <form id="transactionForm">
            <div class="row-inputs">
                <div class="input-group">
                    <label for="type">Type</label>
                    <select id="type">
                        <option value="gain">Gain (+)</option>
                        <option value="spend">Spend (-)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="0" required min="1">
                </div>
            </div>

            <div class="input-group" id="denomInputSection" style="display: none;">
                <label>Bill Counts (Optional)</label>
                <div class="denom-container">
                    <div class="denom-item">
                        <label>1k</label>
                        <input type="number" id="d1k" min="0" value="0" placeholder="0" oninput="calculateTotalFromDenoms()">
                    </div>
                    <div class="denom-item">
                        <label>2k</label>
                        <input type="number" id="d2k" min="0" value="0" placeholder="0" oninput="calculateTotalFromDenoms()">
                    </div>
                    <div class="denom-item">
                        <label>5k</label>
                        <input type="number" id="d5k" min="0" value="0" placeholder="0" oninput="calculateTotalFromDenoms()">
                    </div>
                    <div class="denom-item">
                        <label>10k</label>
                        <input type="number" id="d10k" min="0" value="0" placeholder="0" oninput="calculateTotalFromDenoms()">
                    </div>
                    <div class="denom-item">
                        <label>20k</label>
                        <input type="number" id="d20k" min="0" value="0" placeholder="0" oninput="calculateTotalFromDenoms()">
                    </div>
                    <div class="denom-item">
                        <label>50k</label>
                        <input type="number" id="d50k" min="0" value="0" placeholder="0" oninput="calculateTotalFromDenoms()">
                    </div>
                    <div class="denom-item" style="grid-column: span 3;">
                        <label>100k</label>
                        <input type="number" id="d100k" min="0" value="0" placeholder="0" oninput="calculateTotalFromDenoms()">
                    </div>
                </div>
            </div>

            <div class="row-inputs">
                <div class="input-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="input-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Canned coffee" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">Add Entry</button>
        </form>

        <div class="history-section">
            <h2>History</h2>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();

        let wallets = JSON.parse(localStorage.getItem('hoshino_wallets')) || [
            { id: 'wallet_1', name: 'Main Wallet', photo: '', useDenom: false, transactions: [] }
        ];
        let currentWalletId = wallets[0].id;

        const walletNav = document.getElementById('walletNav');
        const walletBanner = document.getElementById('walletBanner');
        const currentWalletTitle = document.getElementById('currentWalletTitle');
        const totalBalanceEl = document.getElementById('totalBalance');
        const denomSummary = document.getElementById('denomSummary');
        const toggleDenomBtn = document.getElementById('toggleDenomBtn');
        const denomInputSection = document.getElementById('denomInputSection');
        const historyList = document.getElementById('historyList');
        const form = document.getElementById('transactionForm');
        const fileInput = document.getElementById('fileInput');
        const amountInput = document.getElementById('amount');

        const denomKeys = ['1k', '2k', '5k', '10k', '20k', '50k', '100k'];
        const denomValues = { '1k': 1000, '2k': 2000, '5k': 5000, '10k': 10000, '20k': 20000, '50k': 50000, '100k': 100000 };

        function calculateTotalFromDenoms() {
            const wallet = getCurrentWallet();
            if (!wallet.useDenom) return;

            let totalSum = 0;
            denomKeys.forEach(key => {
                let count = parseInt(document.getElementById('d' + key).value) || 0;
                totalSum += count * denomValues[key];
            });

            if (totalSum > 0) {
                amountInput.value = totalSum;
            } else {
                amountInput.value = '';
            }
        }

        function saveAndRender() {
            localStorage.setItem('hoshino_wallets', JSON.stringify(wallets));
            render();
        }

        function getCurrentWallet() {
            return wallets.find(w => w.id === currentWalletId) || wallets[0];
        }

        function switchWallet(id) {
            currentWalletId = id;
            render();
        }

        function addWallet() {
            const name = prompt("Enter new wallet name (e.g., Savings, Snack Fund):");
            if (name && name.trim() !== '') {
                const newWallet = {
                    id: 'wallet_' + Date.now(),
                    name: name.trim(),
                    photo: '',
                    useDenom: false,
                    transactions: []
                };
                wallets.push(newWallet);
                currentWalletId = newWallet.id;
                saveAndRender();
            }
        }

        function renameCurrentWallet() {
            const wallet = getCurrentWallet();
            const newName = prompt("Rename wallet:", wallet.name);
            if (newName && newName.trim() !== '') {
                wallet.name = newName.trim();
                saveAndRender();
            }
        }

        function toggleDenomSystem() {
            const wallet = getCurrentWallet();
            wallet.useDenom = !wallet.useDenom;
            if (!wallet.useDenom) {
                amountInput.value = '';
            }
            saveAndRender();
        }

        function deleteCurrentWallet() {
            if (wallets.length === 1) {
                alert("You need to keep at least one wallet, Sensei!");
                return;
            }
            if (confirm("Are you sure you want to delete this wallet and all its history?")) {
                wallets = wallets.filter(w => w.id !== currentWalletId);
                currentWalletId = wallets[0].id;
                saveAndRender();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(wallets, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "hoshino_wallet_backup_" + new Date().toISOString().slice(0, 10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedWallets = JSON.parse(e.target.result);
                    if (Array.isArray(importedWallets) && importedWallets.length > 0) {
                        if (confirm("This will overwrite your current wallets with the backup data. Proceed, Sensei?")) {
                            wallets = importedWallets;
                            currentWalletId = wallets[0].id;
                            saveAndRender();
                            alert("Backup imported successfully, Sensei!");
                        }
                    } else {
                        alert("Invalid backup file structure!");
                    }
                } catch (err) {
                    alert("Could not read the backup file properly.");
                }
                event.target.value = ''; // Reset input
            };
            reader.readAsText(file);
        }

        function handleBannerClick() {
            const wallet = getCurrentWallet();
            if (wallet.photo) {
                const choice = prompt("Choose an option:\n1. Change Photo\n2. Remove Photo\n\nEnter '1' or '2':", "1");
                if (choice === "1") {
                    fileInput.click();
                } else if (choice === "2") {
                    wallet.photo = '';
                    saveAndRender();
                }
            } else {
                fileInput.click();
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const wallet = getCurrentWallet();
                    wallet.photo = e.target.result;
                    saveAndRender();
                };
                reader.readAsDataURL(file);
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const wallet = getCurrentWallet();

            const type = document.getElementById('type').value;
            const amount = parseFloat(amountInput.value);
            const date = document.getElementById('date').value;
            const description = document.getElementById('description').value;

            if (!amount || amount <= 0) {
                alert("Please enter a valid amount, Sensei!");
                return;
            }

            let denoms = null;
            if (wallet.useDenom) {
                denoms = {};
                denomKeys.forEach(key => {
                    denoms[key] = parseInt(document.getElementById('d' + key).value) || 0;
                });
            }

            const transaction = {
                id: Date.now(),
                type,
                amount,
                date,
                description,
                denoms
            };

            wallet.transactions.unshift(transaction);
            saveAndRender();
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            if (wallet.useDenom) {
                denomKeys.forEach(key => document.getElementById('d' + key).value = 0);
            }
        });

        function deleteTransaction(txId) {
            const wallet = getCurrentWallet();
            wallet.transactions = wallet.transactions.filter(t => t.id !== txId);
            saveAndRender();
        }

        function render() {
            walletNav.innerHTML = '';
            wallets.forEach(w => {
                const tab = document.createElement('button');
                tab.className = `wallet-tab ${w.id === currentWalletId ? 'active' : ''}`;
                tab.textContent = w.name;
                tab.onclick = () => switchWallet(w.id);
                walletNav.appendChild(tab);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-wallet-btn';
            addBtn.textContent = '+ New Wallet';
            addBtn.onclick = addWallet;
            walletNav.appendChild(addBtn);

            const wallet = getCurrentWallet();
            currentWalletTitle.textContent = `${wallet.name} Balance`;

            if (wallet.useDenom) {
                toggleDenomBtn.textContent = "⚙️ Denoms: ON";
                toggleDenomBtn.style.color = "var(--dark-pink)";
                denomInputSection.style.display = "block";
                amountInput.readOnly = true;
                amountInput.style.backgroundColor = "#f9f0f3";
                amountInput.placeholder = "Auto-calculated from bills";
            } else {
                toggleDenomBtn.textContent = "⚙️ Denoms: OFF";
                toggleDenomBtn.style.color = "var(--gray-text)";
                denomInputSection.style.display = "none";
                amountInput.readOnly = false;
                amountInput.style.backgroundColor = "#fff";
                amountInput.placeholder = "0";
            }

            if (wallet.photo) {
                walletBanner.innerHTML = `
                    <div class="circle-frame">
                        <div class="sakura-badge">🌸</div>
                        <img src="${wallet.photo}" alt="Wallet Photo">
                    </div>
                `;
            } else {
                walletBanner.innerHTML = `
                    <div class="circle-frame">
                        <div class="sakura-badge">🌸</div>
                        <span style="font-size: 1.8rem;">🐋</span>
                    </div>
                `;
            }

            historyList.innerHTML = '';
            let total = 0;
            let totalDenoms = {};
            denomKeys.forEach(k => totalDenoms[k] = 0);

            if (wallet.transactions.length === 0) {
                historyList.innerHTML = '<div class="empty-state">No entries in this wallet yet. Time to relax! Uhe~</div>';
                totalBalanceEl.textContent = '0';
                denomSummary.style.display = 'none';
                return;
            }

            wallet.transactions.forEach(t => {
                const multiplier = t.type === 'gain' ? 1 : -1;
                total += t.amount * multiplier;

                if (t.denoms && wallet.useDenom) {
                    denomKeys.forEach(key => {
                        totalDenoms[key] += (t.denoms[key] || 0) * multiplier;
                    });
                }

                const item = document.createElement('div');
                item.className = 'history-item';

                const sign = t.type === 'gain' ? '+' : '-';
                const amountClass = t.type === 'gain' ? 'amount-gain' : 'amount-spend';

                let denomTextStr = '';
                if (t.denoms && wallet.useDenom) {
                    let parts = [];
                    denomKeys.forEach(key => {
                        if (t.denoms[key] > 0) {
                            parts.push(`${t.denoms[key]} ${key}`);
                        }
                    });
                    if (parts.length > 0) {
                        denomTextStr = `(${parts.join(', ')})`;
                    }
                }

                item.innerHTML = `
                    <div class="history-info">
                        <span class="history-desc">${t.description}</span>
                        <span class="history-date">${t.date}</span>
                    </div>
                    <div class="history-amount-group">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span class="history-amount ${amountClass}">${sign}${t.amount.toLocaleString()}</span>
                            <button class="delete-btn" onclick="deleteTransaction(${t.id})">&times;</button>
                        </div>
                        ${denomTextStr ? `<span class="history-denoms">${denomTextStr}</span>` : ''}
                    </div>
                `;
                historyList.appendChild(item);
            });

            totalBalanceEl.textContent = total.toLocaleString();

            if (wallet.useDenom) {
                let denomBadges = [];
                denomKeys.forEach(key => {
                    if (totalDenoms[key] !== 0) {
                        denomBadges.push(`<span class="denom-badge">${totalDenoms[key]} ${key}</span>`);
                    }
                });
                if (denomBadges.length > 0) {
                    denomSummary.innerHTML = denomBadges.join(' ');
                } else {
                    denomSummary.innerHTML = `<span class="denom-badge" style="color:var(--gray-text);">0 bills tracked</span>`;
                }
                denomSummary.style.display = 'flex';
            } else {
                denomSummary.style.display = 'none';
            }
        }

        render();
    </script>
</body>
</html>
