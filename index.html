<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoshino's Daily</title>
    <style>
        :root {
            --bg-color: #fff0f3;
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-pink: #ffb3c6;
            --dark-pink: #ff4d6d;
            --accent-pink: #ffe5ec;
            --text-color: #59405c;
            --gray-text: #8c7893;
            --shadow: 0 4px 15px rgba(255, 179, 198, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid var(--primary-pink);
            transition: background 0.3s ease;
        }

        header {
            background: var(--primary-pink);
            color: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 2px dashed #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title-box {
            background: rgba(255, 255, 255, 0.25);
            padding: 6px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 4px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.95;
            font-weight: 500;
        }

        .vn-section {
            display: flex;
            align-items: center;
            padding: 12px 16px 0 16px;
            gap: 12px;
        }

        .hoshino-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--primary-pink);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            user-select: none;
            transition: transform 0.1s ease;
        }

        .hoshino-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        @keyframes pokeSquish {
            0% { transform: scale(1); }
            30% { transform: scale(0.85, 1.15); }
            60% { transform: scale(1.12, 0.9); }
            100% { transform: scale(1); }
        }

        .squish-anim {
            animation: pokeSquish 0.3s ease;
        }

        .speech-bubble {
            position: relative;
            background: var(--accent-pink);
            border: 2px solid var(--primary-pink);
            border-radius: 16px;
            padding: 12px 14px;
            flex-grow: 1;
            font-size: 0.85rem;
            color: var(--text-color);
            line-height: 1.35;
            box-shadow: 0 2px 8px rgba(255,179,198,0.2);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 8px 10px 8px 0;
            border-style: solid;
            border-color: transparent var(--primary-pink) transparent transparent;
            display: block;
        }

        .speech-bubble strong {
            display: block;
            font-size: 0.75rem;
            color: var(--dark-pink);
            margin-bottom: 2px;
        }

        .music-bar {
            margin: 10px 16px 0 16px;
            background: var(--accent-pink);
            border: 1px dashed var(--primary-pink);
            padding: 8px 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--gray-text);
        }

        .music-controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
            overflow: hidden;
        }

        .music-play-btn {
            background: var(--dark-pink);
            color: #fff;
            border: none;
            width: 26px;
            height: 26px;
            min-width: 26px;
            min-height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.7rem;
            box-shadow: 0 2px 5px rgba(255,77,109,0.3);
            flex-shrink: 0;
            transition: transform 0.1s;
        }

        .music-play-btn:active {
            transform: scale(0.9);
        }

        .music-info {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-info span {
            font-weight: 600;
            color: var(--text-color);
        }

        .volume-control-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .volume-slider {
            width: 75px;
            accent-color: var(--dark-pink);
            cursor: pointer;
        }

        .wallet-nav {
            display: flex;
            gap: 6px;
            padding: 12px 16px 0 16px;
            overflow-x: auto;
            align-items: center;
        }

        .wallet-tab {
            background: var(--accent-pink);
            border: 1px solid var(--primary-pink);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .wallet-tab.active {
            background: var(--dark-pink);
            color: #fff;
            border-color: var(--dark-pink);
            font-weight: 600;
        }

        .add-wallet-btn {
            background: transparent;
            border: 1px dashed var(--dark-pink);
            color: var(--dark-pink);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .wallet-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px 0 16px;
            font-size: 0.75rem;
        }

        .wallet-controls button, .backup-controls button {
            background: transparent;
            border: none;
            color: var(--gray-text);
            cursor: pointer;
            font-size: 0.75rem;
            text-decoration: underline;
        }

        .wallet-controls-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .backup-controls {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 2px 16px 0 16px;
        }

        input[type="file"] {
            display: none;
        }

        .bg-settings-panel {
            margin: 8px 16px 0 16px;
            background: var(--accent-pink);
            border: 1px dashed var(--primary-pink);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.75rem;
        }

        .bg-presets-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
        }

        .bg-preset-btn {
            background: #fff;
            border: 1px solid var(--primary-pink);
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.7rem;
            color: var(--text-color);
        }

        .bg-preset-btn:hover {
            background: var(--primary-pink);
            color: #fff;
        }

        .opacity-control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .wallet-banner {
            margin: 12px 16px 0 16px;
            height: 110px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border: 2px dashed var(--primary-pink);
        }

        .circle-frame {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .circle-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sakura-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.65rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .balance-card {
            margin: 12px 16px 0 16px;
            background: var(--accent-pink);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--primary-pink);
        }

        .balance-card h3 {
            font-size: 0.8rem;
            color: var(--gray-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .total-amount {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--dark-pink);
            margin-top: 4px;
        }

        .denomination-summary {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .denom-badge {
            background: #fff;
            border: 1px solid var(--primary-pink);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            color: var(--text-color);
        }

        form {
            padding: 12px 16px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row-inputs {
            display: flex;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-text);
        }

        .input-group select, .input-group input {
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--primary-pink);
            background: #fff;
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }

        .denom-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: var(--accent-pink);
            padding: 8px;
            border-radius: 12px;
            border: 1px dashed var(--primary-pink);
            width: 100%;
        }

        .denom-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .denom-item label {
            font-size: 0.65rem;
            color: var(--gray-text);
            text-align: center;
        }

        .denom-item input {
            padding: 4px;
            text-align: center;
            font-size: 0.75rem;
            width: 100%;
        }

        .submit-btn {
            background: var(--dark-pink);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(255, 77, 109, 0.3);
            transition: opacity 0.2s;
        }

        .submit-btn:active {
            opacity: 0.85;
        }

        .history-section {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .history-section h2 {
            font-size: 0.95rem;
            color: var(--text-color);
            border-bottom: 1px solid var(--accent-pink);
            padding-bottom: 4px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item-container {
            display: flex;
            flex-direction: column;
            background: var(--accent-pink);
            border-radius: 12px;
            border: 1px solid rgba(255, 179, 198, 0.4);
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .history-item {
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-desc {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .history-date {
            font-size: 0.65rem;
            color: var(--gray-text);
        }

        .history-amount-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .history-amount {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .amount-gain {
            color: #2b9348;
        }

        .amount-spend {
            color: var(--dark-pink);
        }

        .history-denoms {
            font-size: 0.65rem;
            color: var(--gray-text);
        }

        .edit-drawer {
            padding: 8px 12px;
            background: #fff;
            border-top: 1px solid var(--primary-pink);
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.75rem;
            cursor: default;
        }

        .edit-drawer input, .edit-drawer select {
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid var(--primary-pink);
            font-size: 0.75rem;
            width: 100%;
            outline: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--gray-text);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 4px;
        }

        .delete-btn:hover {
            color: var(--dark-pink);
        }

        .empty-state {
            text-align: center;
            font-size: 0.75rem;
            color: var(--gray-text);
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="phone-container" id="phoneContainer">
        <header>
            <div class="header-title-box">
                <h1>🌸 Hoshino's Daily 🌸</h1>
            </div>
            <p>✨ Your clean & cozy wallet tracker~ 🐋</p>
        </header>

        <div class="vn-section">
            <div class="hoshino-avatar" id="hoshinoSpriteBox" onclick="pokeHoshino()">
                <img id="hoshinoSpriteImg" src="" alt="Hoshino Sprite" onerror="this.src='expression/normal.png';">
            </div>
            <div class="speech-bubble">
                <strong>Hoshino 🌸</strong>
                <span id="hoshinoDialogue">"Uhe~ Loading up... ✨"</span>
            </div>
        </div>

        <div class="music-bar">
            <div class="music-controls-group">
                <button class="music-play-btn" id="musicPlayBtn" onclick="togglePlayMusic()">▶</button>
                <div class="music-info" id="currentTrackDisplay"><span>🎵 Loading music...</span></div>
            </div>
            <div class="volume-control-container">
                <span>🔊 Vol</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" class="volume-slider" oninput="updateVolume(this.value)">
            </div>
        </div>

        <div class="wallet-nav" id="walletNav"></div>

        <div class="wallet-controls">
            <button onclick="renameCurrentWallet()">✏️ Rename</button>
            <div class="wallet-controls-group">
                <button onclick="toggleDenomSystem()" id="toggleDenomBtn">⚙️ Denoms: OFF</button>
                <button onclick="toggleBgPanel()" id="toggleBgBtn">🖼️ Bg</button>
                <button onclick="deleteCurrentWallet()" style="color: #ff4d6d;">🗑️ Delete</button>
            </div>
        </div>

        <div class="bg-settings-panel" id="bgSettingsPanel" style="display: none;">
            <div style="font-weight: 600; color: var(--text-color);">🎨 Choose Background Preset:</div>
            <div class="bg-presets-row">
                <button class="bg-preset-btn" onclick="setPresetBg('together')">🏫 Together</button>
                <button class="bg-preset-btn" onclick="setPresetBg('desert')">🏜️ Desert Dunes</button>
                <button class="bg-preset-btn" onclick="setPresetBg('rooftop')">☁️ Rooftop Chill</button>
                <button class="bg-preset-btn" onclick="setPresetBg('none')">❌ Solid Color</button>
            </div>
            <div style="font-weight: 600; color: var(--text-color); margin-top: 4px;">📂 Or Custom Background Image:</div>
            <div style="display: flex; gap: 6px;">
                <button class="action-btn" onclick="document.getElementById('bgFileInput').click()">Upload Image</button>
                <button class="action-btn" onclick="clearCustomBg()">Reset Default</button>
            </div>
            <div class="opacity-control-row" style="margin-top: 4px;">
                <span>White Box Opacity: <span id="opacityValLabel">85</span>%</span>
                <input type="range" min="20" max="100" value="50" class="volume-slider" oninput="updateCardOpacity(this.value)">
            </div>
        </div>

        <div class="backup-controls">
            <button onclick="exportData()">💾 Export</button>
            <button onclick="document.getElementById('importInput').click()">📂 Import</button>
        </div>

        <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">
        <input type="file" id="bgFileInput" accept="image/*" onchange="handleBgUpload(event)">
        <input type="file" id="importInput" accept=".json" onchange="importData(event)">

        <div class="wallet-banner" id="walletBanner" onclick="handleBannerClick()"></div>

        <div class="balance-card">
            <h3 id="currentWalletTitle">Total Balance 💰</h3>
            <div class="total-amount" id="totalBalance">0</div>
            <div class="denomination-summary" id="denomSummary" style="display: none;"></div>
        </div>

        <form id="transactionForm">
            <div class="row-inputs">
                <div class="input-group">
                    <label for="type">Type 🏷️</label>
                    <select id="type">
                        <option value="gain">Gain (+) 📈</option>
                        <option value="spend">Spend (-) 📉</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="amount">Amount 💵</label>
                    <input type="number" id="amount" placeholder="0" required min="1">
                </div>
            </div>

            <div class="input-group" id="denomInputSection" style="display: none;">
                <label>Bill Counts (Optional) 💳</label>
                <div class="denom-container">
                    <div class="denom-item"><label>1k</label><input type="tel" inputmode="numeric" pattern="[0-9]*" id="d1k" value="0" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'" oninput="calculateTotalFromDenoms()"></div>
                    <div class="denom-item"><label>2k</label><input type="tel" inputmode="numeric" pattern="[0-9]*" id="d2k" value="0" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'" oninput="calculateTotalFromDenoms()"></div>
                    <div class="denom-item"><label>5k</label><input type="tel" inputmode="numeric" pattern="[0-9]*" id="d5k" value="0" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'" oninput="calculateTotalFromDenoms()"></div>
                    <div class="denom-item"><label>10k</label><input type="tel" inputmode="numeric" pattern="[0-9]*" id="d10k" value="0" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'" oninput="calculateTotalFromDenoms()"></div>
                    <div class="denom-item"><label>20k</label><input type="tel" inputmode="numeric" pattern="[0-9]*" id="d20k" value="0" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'" oninput="calculateTotalFromDenoms()"></div>
                    <div class="denom-item"><label>50k</label><input type="tel" inputmode="numeric" pattern="[0-9]*" id="d50k" value="0" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'" oninput="calculateTotalFromDenoms()"></div>
                    <div class="denom-item" style="grid-column: span 3;"><label>100k</label><input type="tel" inputmode="numeric" pattern="[0-9]*" id="d100k" value="0" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'" oninput="calculateTotalFromDenoms()"></div>
                </div>
            </div>

            <div class="row-inputs">
                <div class="input-group"><label for="date">Date 📅</label><input type="date" id="date" required></div>
                <div class="input-group"><label for="description">Description 📝</label><input type="text" id="description" placeholder="e.g., Canned coffee ☕" required></div>
            </div>

            <button type="submit" class="submit-btn">Add Entry ✨</button>
        </form>

        <div class="history-section">
            <h2>History 📜</h2>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // //PATH PLACE - ALL PATHS ARE COLLECTED HERE
        // ==========================================
        
        // //expression
        const expressionSprites = {
            normal: 'expression/normal.png',
            squished: 'expression/squished.png',
            sleepy: 'expression/sleepy.png',
            happy: 'expression/happy.png',
            joking: 'expression/joking.png',
            surprised: 'expression/surprised.png',
            embarrassed: 'expression/embarrassed.png'
        };

        // //audio (BGM tracks, Login Greeting sound, and Squish sound)
        const audioTracks = {
            morning: new Audio('audio/bgm_morning.mp3'),
            noon: new Audio('audio/bgm_noon.mp3'),
            afternoon: new Audio('audio/bgm_afternoon.mp3'),
            night: new Audio('audio/bgm_night.mp3'),
            latenight: new Audio('audio/bgm_latenight.mp3')
        };

        const loginGreetingAudio = new Audio('audio/login_greeting.mp3'); // Put your login greeting path here
        const squishAudio = new Audio('audio/squish.mp3');                 // Put your squish sound path here

        // //background presets link handlers inside applyBackgroundAndOpacity() below
        // abydos, desert, rooftop, etc.

        // ==========================================
        // SCRIPT LOGIC
        // ==========================================

        document.getElementById('date').valueAsDate = new Date();

        let customBg = localStorage.getItem('hoshino_custom_bg') || 'together';
        let customOpacity = localStorage.getItem('hoshino_bg_opacity') || '50';
        applyBackgroundAndOpacity();

        function applyBackgroundAndOpacity() {
            const phoneContainer = document.getElementById('phoneContainer');
            phoneContainer.style.background = `rgba(255, 255, 255, ${parseFloat(customOpacity) / 100})`;
            document.getElementById('opacityValLabel').textContent = customOpacity;

            if (customBg === 'together') {
                document.body.style.backgroundImage = "url('background/together.jpg')";
            } else if (customBg === 'desert') {
                document.body.style.backgroundImage = "url('background/abydos.jpg')";
            } else if (customBg === 'rooftop') {
                document.body.style.backgroundImage = "url('background/abydos.jpg')";
            } else if (customBg.startsWith('data:image')) {
                document.body.style.backgroundImage = `url('${customBg}')`;
            } else {
                document.body.style.backgroundImage = 'none';
            }
        }

        function setPresetBg(type) {
            customBg = type;
            localStorage.setItem('hoshino_custom_bg', type);
            applyBackgroundAndOpacity();
        }

        function clearCustomBg() {
            customBg = 'together';
            localStorage.setItem('hoshino_custom_bg', 'together');
            applyBackgroundAndOpacity();
        }

        function handleBgUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    customBg = e.target.result;
                    localStorage.setItem('hoshino_custom_bg', customBg);
                    applyBackgroundAndOpacity();
                };
                reader.readAsDataURL(file);
            }
        }

        function updateCardOpacity(val) {
            customOpacity = val;
            localStorage.setItem('hoshino_bg_opacity', val);
            applyBackgroundAndOpacity();
        }

        function toggleBgPanel() {
            const panel = document.getElementById('bgSettingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        let gameVolume = parseFloat(localStorage.getItem("hoshinoGameVolume")) || 0.5;
        document.getElementById('volumeSlider').value = gameVolume;

        Object.values(audioTracks).forEach(audio => {
            audio.loop = true;
            audio.volume = gameVolume;
        });
        loginGreetingAudio.volume = gameVolume;
        squishAudio.volume = gameVolume;

        let isPlaying = false;
        let currentPeriod = 'morning';
        const musicPlayBtn = document.getElementById('musicPlayBtn');
        const currentTrackDisplay = document.getElementById('currentTrackDisplay');

        function getTimePeriod() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 11) return 'morning';
            if (hour >= 11 && hour < 15) return 'noon';
            if (hour >= 15 && hour < 19) return 'afternoon';
            if (hour >= 19 && hour < 23) return 'night';
            return 'latenight';
        }

        const trackLabels = {
            morning: "🎵 Morning BGM (Fresh Start) 🌸",
            noon: "🎵 Noon BGM (Warm Breeze) ☀️",
            afternoon: "🎵 Afternoon BGM (Lazy Hours) 💤",
            night: "🎵 Night BGM (Stargazing) 🌙",
            latenight: "🎵 Late Night BGM (Deep Slumber) 🌌"
        };

        function startBGM() {
            currentPeriod = getTimePeriod();
            Object.keys(audioTracks).forEach(period => {
                audioTracks[period].pause();
                audioTracks[period].currentTime = 0;
            });
            const activeAudio = audioTracks[currentPeriod] || audioTracks.morning;
            activeAudio.volume = gameVolume;
            activeAudio.play().then(() => {
                isPlaying = true;
                musicPlayBtn.textContent = "❚❚";
            }).catch(e => {
                isPlaying = false;
                musicPlayBtn.textContent = "▶";
            });
            currentTrackDisplay.innerHTML = `<span>${trackLabels[currentPeriod]}</span>`;

            // Trigger Login Greeting sound when app loads/starts up
            loginGreetingAudio.currentTime = 0;
            loginGreetingAudio.play().catch(e => {
                // Browsers often block autoplay until user interacts, 
                // so we can also tie it to a one-time click anywhere if blocked
            });
        }

        function togglePlayMusic() {
            const activeAudio = audioTracks[currentPeriod] || audioTracks.morning;
            if (isPlaying) {
                Object.values(audioTracks).forEach(audio => audio.pause());
                isPlaying = false;
                musicPlayBtn.textContent = "▶";
            } else {
                activeAudio.volume = gameVolume;
                activeAudio.play().then(() => {
                    isPlaying = true;
                    musicPlayBtn.textContent = "❚❚";
                }).catch(e => {});
            }
        }

        function updateVolume(val) {
            gameVolume = parseFloat(val);
            localStorage.setItem("hoshinoGameVolume", gameVolume);
            Object.values(audioTracks).forEach(audio => {
                audio.volume = gameVolume;
            });
            loginGreetingAudio.volume = gameVolume;
            squishAudio.volume = gameVolume;

            const activeAudio = audioTracks[currentPeriod] || audioTracks.morning;
            if (activeAudio.paused && gameVolume > 0 && isPlaying) {
                activeAudio.play().catch(e => {});
            }
        }

        startBGM();

        let wallets = JSON.parse(localStorage.getItem('hoshino_wallets')) || [
            { id: 'wallet_1', name: 'Main Wallet 💼', photo: '', useDenom: false, transactions: [] }
        ];
        let currentWalletId = wallets[0].id;
        let activeEditTxId = null;

        const expressionDialogues = {
            normal: [
                "Good morning, Sensei! 🌸 Did you sleep well? Let's take it easy today~",
                "Just keeping an eye on things around here. 🐋 Want a canned coffee, Sensei?",
                "The weather's pretty nice today, perfect for doing absolutely nothing~ ☀️",
                "Need help with any paperwork, Sensei? 📋 Well, don't expect too much from this old-timer.",
                "Ah, taking a break already? 🍵 Good choice, good choice."
            ],
            squished: [
                "Uhe~ My cheeks are getting squished! ✨",
                "Stp... stp it, Sensei! That tickles! 😆",
                "Do you treat all your students this playfully, or just me? 🌸",
                "My face isn't a stress ball, you know... 💢",
                "Hmph... If you keep doing that, I'm going back to sleep. 💤"
            ],
            sleepy: [
                "Zzz... Five more minutes, Sensei... 💤",
                "The sun is way too warm... Let's find some shade to nap under. 🌴",
                "Phew... Ayane-chan's voice is starting to sound like a lullaby... 🎶",
                "My eyelids feel like they weigh a ton today. Uhe~... 😴",
                "Thinking about whale migrations always makes me want to drift off... 🐋"
            ],
            happy: [
                "Uhe~ Nonomi brought some nice sweets! 🍡 Want some, Sensei?",
                "Shiroko-chan's already out jogging while I'm enjoying this warm breeze~ 🚲",
                "Days like this where nothing bad happens are the absolute best. ✨",
                "Hehe, seeing you work hard makes this old-timer proud... in her own lazy way. 💖",
                "Look at this whale keychain I found! Isn't it adorable? 🐋"
            ],
            joking: [
                "Afternoon paperwork is so boring. Let's slack off a bit, Sensei~ 🎮",
                "Hehe, sneaking around at this hour? What kind of prank are you planning? 🕵️",
                "If anyone asks, tell them I'm out doing 'vital committee research' (sleeping). 🛏️",
                "Wanna race to the rooftop? Just kidding, my joints would give out. 🏃‍♀️",
                "Serika-chan's panicking over the budget again! Let's go tease her later~ 💸"
            ],
            surprised: [
                "Eh?! An audit committee check already?! Since when?! 💥",
                "Woah! Don't sneak up on me while I'm dozing off like that! 😲",
                "Ehh?! It's already past 2 AM?! Time is completely broken! ⏰",
                "Did a ghost appear or something, Sensei? You look wide awake! 👻",
                "Wah?! What was that sudden noise for?! ⚡"
            ],
            embarrassed: [
                "D-don't say embarrassing things out of nowhere like that! 😳",
                "Stop staring at my bedhead! It's rude, Sensei! 💢",
                "W-what are you looking at? My desk isn't that messy! 📚",
                "Jeez, you're treating me like a kid again... 💦",
                "Ugh... My face feels all hot. Don't look at me! 🙈"
            ]
        };

        const pokeDialogues = [
            { text: "Uhe~ Don't poke an old-timer so suddenly... 🌸", expr: "squished" },
            { text: "Zzz... Five more minutes, Sensei... 💤", expr: "sleepy" },
            { text: "Need something? Or are you just bored? ☕", expr: "normal" },
            { text: "Hehe, you look free today. Want to share a canned coffee? 🥤", expr: "happy" },
            { text: "Stop teasing me! I'm on break! 🛋️", expr: "joking" },
            { text: "Wah?! What was that for?! ⚡", expr: "surprised" },
            { text: "Jeez, you're treating me like a kid... 💦", expr: "embarrassed" }
        ];

        function getRandomDialogue(exprKey) {
            const list = expressionDialogues[exprKey] || expressionDialogues.normal;
            return list[Math.floor(Math.random() * list.length)];
        }

        const currentPeriodTime = getTimePeriod();
        const defaultExprMap = { morning: 'sleepy', noon: 'normal', afternoon: 'joking', night: 'happy', latenight: 'sleepy' };
        const initialExpr = defaultExprMap[currentPeriodTime] || 'normal';
        let startupText = getRandomDialogue(initialExpr);

        const hoshinoSpriteImg = document.getElementById('hoshinoSpriteImg');
        const hoshinoSpriteBox = document.getElementById('hoshinoSpriteBox');
        const hoshinoDialogue = document.getElementById('hoshinoDialogue');
        const walletNav = document.getElementById('walletNav');
        const walletBanner = document.getElementById('walletBanner');
        const currentWalletTitle = document.getElementById('currentWalletTitle');
        const totalBalanceEl = document.getElementById('totalBalance');
        const denomSummary = document.getElementById('denomSummary');
        const toggleDenomBtn = document.getElementById('toggleDenomBtn');
        const denomInputSection = document.getElementById('denomInputSection');
        const historyList = document.getElementById('historyList');
        const form = document.getElementById('transactionForm');
        const fileInput = document.getElementById('fileInput');
        const amountInput = document.getElementById('amount');

        function updateHoshinoDisplay(exprKey, text) {
            hoshinoDialogue.textContent = `"${text}"`;
            hoshinoSpriteImg.style.display = 'block';
            hoshinoSpriteImg.src = expressionSprites[exprKey] || 'expression/normal.png';
        }

        updateHoshinoDisplay(initialExpr, startupText);

        function pokeHoshino() {
            hoshinoSpriteBox.classList.remove('squish-anim');
            void hoshinoSpriteBox.offsetWidth;
            hoshinoSpriteBox.classList.add('squish-anim');

            // Play the squish audio effect when poked/squished
            squishAudio.currentTime = 0;
            squishAudio.play().catch(e => {});

            const randomPoke = pokeDialogues[Math.floor(Math.random() * pokeDialogues.length)];
            const chosenText = getRandomDialogue(randomPoke.expr);
            updateHoshinoDisplay(randomPoke.expr, chosenText);
        }

        const denomKeys = ['1k', '2k', '5k', '10k', '20k', '50k', '100k'];
        const denomValues = { '1k': 1000, '2k': 2000, '5k': 5000, '10k': 10000, '20k': 20000, '50k': 50000, '100k': 100000 };

        function calculateTotalFromDenoms() {
            const wallet = getCurrentWallet();
            if (!wallet.useDenom) return;
            let totalSum = 0;
            denomKeys.forEach(key => {
                let val = parseInt(document.getElementById('d' + key).value) || 0;
                totalSum += val * denomValues[key];
            });
            amountInput.value = totalSum > 0 ? totalSum : '';
        }

        function saveAndRender() {
            localStorage.setItem('hoshino_wallets', JSON.stringify(wallets));
            render();
        }

        function getCurrentWallet() {
            return wallets.find(w => w.id === currentWalletId) || wallets[0];
        }

        function switchWallet(id) {
            currentWalletId = id;
            activeEditTxId = null;
            render();
        }

        function addWallet() {
            const name = prompt("Enter new wallet name (e.g., Savings, Snack Fund 🍡):");
            if (name && name.trim() !== '') {
                const newWallet = { id: 'wallet_' + Date.now(), name: name.trim(), photo: '', useDenom: false, transactions: [] };
                wallets.push(newWallet);
                currentWalletId = newWallet.id;
                activeEditTxId = null;
                saveAndRender();
            }
        }

        function renameCurrentWallet() {
            const wallet = getCurrentWallet();
            const newName = prompt("Rename wallet:", wallet.name);
            if (newName && newName.trim() !== '') {
                wallet.name = newName.trim();
                saveAndRender();
            }
        }

        function toggleDenomSystem() {
            const wallet = getCurrentWallet();
            wallet.useDenom = !wallet.useDenom;
            if (!wallet.useDenom) amountInput.value = '';
            saveAndRender();
        }

        function deleteCurrentWallet() {
            if (wallets.length === 1) {
                alert("You need to keep at least one wallet, Sensei! 🌸");
                return;
            }
            if (confirm("Are you sure you want to delete this wallet and all its history? 🗑️")) {
                wallets = wallets.filter(w => w.id !== currentWalletId);
                currentWalletId = wallets[0].id;
                activeEditTxId = null;
                saveAndRender();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ wallets }, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "Hoshino_Daily_" + new Date().toISOString().slice(0, 10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.wallets && Array.isArray(imported.wallets)) {
                        if (confirm("Overwrite current data with backup? 📂")) {
                            wallets = imported.wallets;
                            currentWalletId = wallets[0].id;
                            activeEditTxId = null;
                            saveAndRender();
                            alert("Backup imported successfully! Reloading... ✨");
                            location.reload();
                        }
                    } else {
                        alert("Invalid backup file structure! ❌");
                    }
                } catch (err) {
                    alert("Could not read the backup file properly. ⚠️");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function handleBannerClick() {
            const wallet = getCurrentWallet();
            const action = prompt("Choose an option:\n1. Change Wallet Photo 🖼️\n2. Remove Wallet Photo ❌\n\nEnter '1' or '2':", "1");
            if (action === "1") fileInput.click();
            else if (action === "2") { wallet.photo = ''; saveAndRender(); }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    getCurrentWallet().photo = e.target.result;
                    saveAndRender();
                };
                reader.readAsDataURL(file);
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const wallet = getCurrentWallet();
            const type = document.getElementById('type').value;
            const amount = parseFloat(amountInput.value);
            const date = document.getElementById('date').value;
            const description = document.getElementById('description').value;
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            if (!amount || amount <= 0) {
                alert("Please enter a valid amount, Sensei! 💸");
                return;
            }

            let denoms = null;
            if (wallet.useDenom) {
                denoms = {};
                denomKeys.forEach(key => {
                    denoms[key] = parseInt(document.getElementById('d' + key).value) || 0;
                });
            }

            wallet.transactions.unshift({ id: Date.now(), type, amount, date, time: timeStr, description, denoms });
            activeEditTxId = null;
            saveAndRender();
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            if (wallet.useDenom) {
                denomKeys.forEach(key => document.getElementById('d' + key).value = '0');
            }
        });

        function deleteTransaction(txId) {
            const wallet = getCurrentWallet();
            wallet.transactions = wallet.transactions.filter(t => t.id !== txId);
            if (activeEditTxId === txId) activeEditTxId = null;
            saveAndRender();
        }

        function toggleTransactionDrawer(txId) {
            if (activeEditTxId === txId) {
                activeEditTxId = null;
            } else {
                activeEditTxId = txId;
            }
            render();
        }

        function saveEditedTransaction(txId) {
            const wallet = getCurrentWallet();
            const tx = wallet.transactions.find(t => t.id === txId);
            if (!tx) return;

            const newDesc = document.getElementById(`editDesc_${txId}`).value.trim();
            const newAmount = parseFloat(document.getElementById(`editAmount_${txId}`).value);
            const newType = document.getElementById(`editType_${txId}`).value;
            const newDate = document.getElementById(`editDate_${txId}`).value;

            if (!newAmount || newAmount <= 0 || !newDesc || !newDate) {
                alert("Please fill in valid transaction details, Sensei! ✨");
                return;
            }

            tx.description = newDesc;
            tx.amount = newAmount;
            tx.type = newType;
            tx.date = newDate;
            activeEditTxId = null;
            saveAndRender();
        }

        function render() {
            walletNav.innerHTML = '';
            wallets.forEach(w => {
                const tab = document.createElement('button');
                tab.className = `wallet-tab ${w.id === currentWalletId ? 'active' : ''}`;
                tab.textContent = w.name;
                tab.onclick = () => switchWallet(w.id);
                walletNav.appendChild(tab);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-wallet-btn';
            addBtn.textContent = '+ New Wallet 🌸';
            addBtn.onclick = addWallet;
            walletNav.appendChild(addBtn);

            const wallet = getCurrentWallet();
            currentWalletTitle.textContent = `${wallet.name} Balance 💰`;

            if (wallet.useDenom) {
                toggleDenomBtn.textContent = "⚙️ Denoms: ON";
                toggleDenomBtn.style.color = "var(--dark-pink)";
                denomInputSection.style.display = "block";
                amountInput.readOnly = true;
                amountInput.style.backgroundColor = "#f9f0f3";
                amountInput.placeholder = "Auto-calculated from bills 💳";
            } else {
                toggleDenomBtn.textContent = "⚙️ Denoms: OFF";
                toggleDenomBtn.style.color = "var(--gray-text)";
                denomInputSection.style.display = "none";
                amountInput.readOnly = false;
                amountInput.style.backgroundColor = "#fff";
                amountInput.placeholder = "0";
            }

            if (wallet.photo) {
                walletBanner.innerHTML = `<div class="circle-frame"><div class="sakura-badge">🌸</div><img src="${wallet.photo}" alt="Wallet Photo"></div>`;
            } else {
                walletBanner.innerHTML = `<div class="circle-frame"><div class="sakura-badge">🌸</div><span style="font-size: 1.8rem;">🐋</span></div>`;
            }

            historyList.innerHTML = '';
            let total = 0;
            let totalDenoms = {};
            denomKeys.forEach(k => totalDenoms[k] = 0);

            if (wallet.transactions.length === 0) {
                historyList.innerHTML = '<div class="empty-state">No entries in this wallet yet. Time to relax! Uhe~ ☕💤</div>';
                totalBalanceEl.textContent = '0';
                denomSummary.style.display = 'none';
                return;
            }

            wallet.transactions.forEach(t => {
                const multiplier = t.type === 'gain' ? 1 : -1;
                total += t.amount * multiplier;

                if (t.denoms && wallet.useDenom) {
                    denomKeys.forEach(key => {
                        totalDenoms[key] += (t.denoms[key] || 0) * multiplier;
                    });
                }

                const container = document.createElement('div');
                container.className = 'history-item-container';
                container.onclick = (e) => {
                    if (e.target.closest('.delete-btn') || e.target.closest('.edit-drawer')) return;
                    toggleTransactionDrawer(t.id);
                };

                const sign = t.type === 'gain' ? '+' : '-';
                const amountClass = t.type === 'gain' ? 'amount-gain' : 'amount-spend';
                const timeDisplay = t.time ? ` • ${t.time}` : '';

                let denomTextStr = '';
                if (t.denoms && wallet.useDenom) {
                    let parts = [];
                    denomKeys.forEach(key => {
                        if (t.denoms[key] > 0) parts.push(`${t.denoms[key]} ${key}`);
                    });
                    if (parts.length > 0) denomTextStr = `(${parts.join(', ')})`;
                }

                const isOpen = activeEditTxId === t.id;

                container.innerHTML = `
                    <div class="history-item">
                        <div class="history-info">
                            <span class="history-desc">${t.description}</span>
                            <span class="history-date">${t.date}${timeDisplay}</span>
                        </div>
                        <div class="history-amount-group">
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <span class="history-amount ${amountClass}">${sign}${t.amount.toLocaleString()}</span>
                                <button class="delete-btn" onclick="deleteTransaction(${t.id})">&times;</button>
                            </div>
                            ${denomTextStr ? `<span class="history-denoms">${denomTextStr}</span>` : ''}
                        </div>
                    </div>
                    ${isOpen ? `
                    <div class="edit-drawer" style="display: flex;" onclick="event.stopPropagation()">
                        <label>Description:</label>
                        <input type="text" id="editDesc_${t.id}" value="${t.description}">
                        <div style="display:flex; gap:6px;">
                            <div style="flex:1;">
                                <label>Amount:</label>
                                <input type="number" id="editAmount_${t.id}" value="${t.amount}" min="1">
                            </div>
                            <div style="flex:1;">
                                <label>Type:</label>
                                <select id="editType_${t.id}">
                                    <option value="gain" ${t.type==='gain'?'selected':''}>Gain (+)</option>
                                    <option value="spend" ${t.type==='spend'?'selected':''}>Spend (-)</option>
                                </select>
                            </div>
                        </div>
                        <label>Date:</label>
                        <input type="date" id="editDate_${t.id}" value="${t.date}">
                        <button class="submit-btn" style="padding: 6px; font-size: 0.8rem; margin-top: 4px;" onclick="saveEditedTransaction(${t.id})">Save Changes ✨</button>
                    </div>` : ''}
                `;
                historyList.appendChild(container);
            });

            totalBalanceEl.textContent = total.toLocaleString();

            if (wallet.useDenom) {
                let denomBadges = [];
                denomKeys.forEach(key => {
                    if (totalDenoms[key] !== 0) denomBadges.push(`<span class="denom-badge">${totalDenoms[key]} ${key}</span>`);
                });
                denomSummary.innerHTML = denomBadges.length > 0 ? denomBadges.join(' ') : `<span class="denom-badge" style="color:var(--gray-text);">0 bills tracked 💳</span>`;
                denomSummary.style.display = 'flex';
            } else {
                denomSummary.style.display = 'none';
            }
        }

        render();
    </script>
</body>
</html>
